server:
  port: 8000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: backend-api
              uri: ${BACKEND_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
          filters:
            - AddResponseHeader=X-Served-By, gateway
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: [Authorization, Content-Type]