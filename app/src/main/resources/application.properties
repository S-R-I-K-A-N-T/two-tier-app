spring.application.name=app

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reactapp}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-min-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

#cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}